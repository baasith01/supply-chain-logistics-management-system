# Prometheus configuration for Logistics Supply Chain Intelligence
#
# This configuration is designed for the project's local Docker-based
# monitoring setup. Prometheus scrapes itself and a Windows Exporter
# instance running on the host machine.
#
# Optional application/Kafka exporters can be enabled when those exporters
# are actually running and exposing metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Optional alerting configuration can be added here when Alertmanager is
# deployed.
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# Optional rule files.
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # Prometheus health and internal metrics.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          environment: local

  # Windows host metrics.
  #
  # Windows Exporter should be running on the host and listening on port 9182.
  # host.docker.internal allows the Prometheus Docker container to reach the
  # Windows host on Docker Desktop.
  - job_name: windows_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:9182
        labels:
          service: windows
          environment: local

  # Kafka metrics.
  #
  # The current docker-compose setup does not expose a Kafka JMX exporter,
  # so this target is intentionally disabled. Enable it only after deploying
  # an exporter that exposes Kafka metrics on the specified endpoint.
  #
  # - job_name: kafka
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets:
  #         - kafka-exporter:9308
  #       labels:
  #         service: kafka
  #         environment: local

  # Optional application metrics.
  #
  # Enable this job if a project service exposes Prometheus metrics, for
  # example through an HTTP /metrics endpoint.
  #
  # - job_name: logistics_application
  #   scrape_interval: 15s
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:8000
  #       labels:
  #         service: logistics-application
  #         environment: local

  # Optional Spark metrics.
  #
  # Spark does not automatically expose the project's desired business
  # metrics through this target. Configure Spark's Prometheus-compatible
  # metrics source/exporter first, then enable this section.
  #
  # - job_name: spark
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:4040
  #       labels:
  #         service: spark
  #         environment: local
